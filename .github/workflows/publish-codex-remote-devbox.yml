name: Publish Codex Remote Devbox

on:
  push:
    branches:
      - main
    paths:
      - "codex-remote-devbox/.dockerignore"
      - "codex-remote-devbox/Dockerfile"
      - "codex-remote-devbox/entrypoint.sh"
      - "codex-remote-devbox/sshd_config"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-codex-remote-devbox
  cancel-in-progress: false

env:
  IMAGE_NAME: codex-remote-devbox
  IMAGE_TAG: codex-0.149.0-r3
  CODEX_VERSION: 0.149.0
  BASE_IMAGE_NAME: docker.io/library/node:24.19.0-bookworm-slim
  BASE_IMAGE_DIGEST: sha256:3638d9a6fe4030bd716be989438248074489337ba3275657f93595428be4fc03
  DOCKER_CLI_PACKAGE_VERSION: 5:29.7.2-1~debian.12~bookworm
  DOCKER_BUILDX_PACKAGE_VERSION: 0.36.1-1~debian.12~bookworm
  DOCKER_COMPOSE_PACKAGE_VERSION: 5.5.0-1~debian.12~bookworm
  DOCKER_APT_GPG_SHA256: 1500c1f56fa9e26b9b8f42452a553675796ade0807cdce11975eb98170b3a570

jobs:
  guard:
    name: Require main
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Refuse a non-main ref
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error title=Invalid publish ref::Remote devbox images may only be published from refs/heads/main"
            exit 1
          fi

  validate:
    name: Validate image
    needs: guard
    permissions:
      contents: read
    uses: ./.github/workflows/validate-codex-remote-devbox.yml

  publish:
    name: Build and publish
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve image coordinates
        id: image
        shell: bash
        run: |
          set -euo pipefail
          owner_lc="${GITHUB_REPOSITORY_OWNER,,}"
          echo "image=ghcr.io/${owner_lc}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "ref=ghcr.io/${owner_lc}/${IMAGE_NAME}:${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse an existing immutable tag before build
        shell: bash
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: |
          set -euo pipefail

          inspect_log="$(mktemp)"
          trap 'rm -f "$inspect_log"' EXIT

          if docker buildx imagetools inspect "$IMAGE_REF" >"$inspect_log" 2>&1; then
            cat "$inspect_log"
            echo "::error title=Immutable image tag already exists::Refusing to overwrite ${IMAGE_REF}"
            exit 1
          fi

          if grep -Fxq "ERROR: ${IMAGE_REF}: not found" "$inspect_log"; then
            echo "Immutable tag is available before build: ${IMAGE_REF}"
            exit 0
          fi

          cat "$inspect_log" >&2
          echo "::error title=Unable to verify image tag::Refusing to build because ${IMAGE_REF} availability could not be confirmed"
          exit 1

      - name: Build multi-platform image without publishing
        uses: docker/build-push-action@v7
        with:
          context: codex-remote-devbox
          file: codex-remote-devbox/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=codex-remote-devbox-publish
          cache-to: type=gha,mode=max,scope=codex-remote-devbox-publish

      - name: Refuse an existing immutable tag immediately before publish
        shell: bash
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: |
          set -euo pipefail

          inspect_log="$(mktemp)"
          trap 'rm -f "$inspect_log"' EXIT

          if docker buildx imagetools inspect "$IMAGE_REF" >"$inspect_log" 2>&1; then
            cat "$inspect_log"
            echo "::error title=Immutable image tag already exists::Refusing to overwrite ${IMAGE_REF}"
            exit 1
          fi

          if grep -Fxq "ERROR: ${IMAGE_REF}: not found" "$inspect_log"; then
            echo "Immutable tag is available immediately before publish: ${IMAGE_REF}"
            exit 0
          fi

          cat "$inspect_log" >&2
          echo "::error title=Unable to verify image tag::Refusing to publish because ${IMAGE_REF} availability could not be confirmed"
          exit 1

      - name: Publish immutable multi-platform image
        id: publish
        uses: docker/build-push-action@v7
        with:
          context: codex-remote-devbox
          file: codex-remote-devbox/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.ref }}
          cache-from: type=gha,scope=codex-remote-devbox-publish
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.title=Codex Remote Devbox
            org.opencontainers.image.description=SSH-accessible remote development environment for Codex Desktop
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.IMAGE_TAG }}
            org.opencontainers.image.base.name=${{ env.BASE_IMAGE_NAME }}
            org.opencontainers.image.base.digest=${{ env.BASE_IMAGE_DIGEST }}
            io.imageyard.codex.version=${{ env.CODEX_VERSION }}
            io.imageyard.docker-ce-cli.package-version=${{ env.DOCKER_CLI_PACKAGE_VERSION }}
            io.imageyard.docker-buildx-plugin.package-version=${{ env.DOCKER_BUILDX_PACKAGE_VERSION }}
            io.imageyard.docker-compose-plugin.package-version=${{ env.DOCKER_COMPOSE_PACKAGE_VERSION }}
            io.imageyard.docker.apt-gpg-sha256=${{ env.DOCKER_APT_GPG_SHA256 }}

      - name: Verify published index and record digests
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          IMAGE_REF: ${{ steps.image.outputs.ref }}
          INDEX_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail

          inspect_log="$(mktemp)"
          index_raw="$(mktemp)"
          trap 'rm -f "$inspect_log" "$index_raw"' EXIT
          [[ "$INDEX_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]

          tag_digest="$(
            docker buildx imagetools inspect "$IMAGE_REF" \
              | awk '$1 == "Digest:" { print $2; exit }'
          )"
          [[ "$tag_digest" == "$INDEX_DIGEST" ]]

          immutable_ref="${IMAGE}@${INDEX_DIGEST}"
          docker buildx imagetools inspect "$immutable_ref" | tee "$inspect_log"
          docker buildx imagetools inspect --raw "$immutable_ref" > "$index_raw"

          grep -Fq "Platform:    linux/amd64" "$inspect_log"
          grep -Fq "Platform:    linux/arm64" "$inspect_log"

          amd64_digest="$(
            jq -er '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64")] | if length == 1 then .[0].digest else error("expected exactly one linux/amd64 manifest") end' \
              "$index_raw"
          )"
          arm64_digest="$(
            jq -er '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64")] | if length == 1 then .[0].digest else error("expected exactly one linux/arm64 manifest") end' \
              "$index_raw"
          )"
          amd64_config_digest="$(
            docker buildx imagetools inspect --raw "${IMAGE}@${amd64_digest}" | jq -er '.config.digest'
          )"
          arm64_config_digest="$(
            docker buildx imagetools inspect --raw "${IMAGE}@${arm64_digest}" | jq -er '.config.digest'
          )"

          {
            echo "### Codex Remote Devbox published"
            echo
            echo "- Image: \`${IMAGE_REF}\`"
            echo "- OCI index digest: \`${INDEX_DIGEST}\`"
            echo "- AMD64 manifest digest: \`${amd64_digest}\`"
            echo "- AMD64 config digest: \`${amd64_config_digest}\`"
            echo "- ARM64 manifest digest: \`${arm64_digest}\`"
            echo "- ARM64 config digest: \`${arm64_config_digest}\`"
            echo "- Source revision: \`${GITHUB_SHA}\`"
            echo
            echo '```text'
            cat "$inspect_log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
